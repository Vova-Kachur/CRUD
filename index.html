<!DOCTYPE html><html lang=uk><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>CRUD Students</title><link rel=stylesheet href=/CRUD/CRUD.e07b2320.css><body>

  <div class=container>

    <h1>Список студентів</h1>

    <button id=get-students-btn>
      Отримати студентів
    </button>

    <table id=students-table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Ім'я</th>
          <th>Вік</th>
          <th>Курс</th>
          <th>Навички</th>
          <th>Email</th>
          <th>Статус</th>
          <th>Дії</th>
        </tr>
      </thead>

      <tbody>
        
      </tbody>

    </table>

    <h2>Додати нового студента</h2>

    <form id=add-student-form>

      <label>
        Ім'я
        <input id=name required>
      </label>

      <label>
        Вік
        <input type=number id=age required>
      </label>

      <label>
        Курс
        <input id=course required>
      </label>

      <label>
        Навички (через кому)
        <input id=skills required>
      </label>

      <label>
        Email
        <input type=email id=email required>
      </label>

      <label class=checkbox>
        <input type=checkbox id=isEnrolled>
        Записаний
      </label>

      <button>
        Додати студента
      </button>

    </form>

  </div>

  <script src=/CRUD/CRUD.dd15b299.js></script>
